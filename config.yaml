# config.yaml — the one file you edit before running the notebooks.
#
# Eight settings. Every notebook reads this file, so you set them ONCE, as a group,
# and notebooks 01-05 all agree with each other: same track, same seed, same file
# names. That is the point of a shared file — five copies of a seed is five chances
# for the sample in notebook 03 not to be the sample notebook 02 drew.
#
# Edit it, save it, and re-run the SETUP cell of whichever notebook you are in.
# It should match your PLAN.md.
#
# ----------------------------------------------------------------------------------
# WHERE THESE END UP
# ----------------------------------------------------------------------------------
# You never type a file path in this project. Every file is named from the settings
# below, which is why notebook 03 opens exactly the file notebook 02 wrote:
#
#     data/pools/<track>_pool.json                       <- notebook 01 writes
#     data/gold/<track>_<group>_<run>_sample.json        <- notebook 02 writes
#     data/gold/<track>_<group>_<run>_gold.json          <- notebook 03 writes
#     data/gold/<track>_<group>_<run>_dev.json           <- notebook 03 writes
#     data/gold/<track>_<group>_<run>_test.json          <- notebook 03 writes
#     outputs/<track>_<group>_<run>_predictions.json     <- notebook 04 writes
#     outputs/<track>_<group>_<run>_test_log.jsonl       <- notebook 04 appends
#     prompts/<track>.txt                                <- notebook 04 reads
#
# So `track: cars50` + `group: kimura` + `run: v1` means notebook 03 writes
# data/gold/cars50_kimura_v1_gold.json. Change a setting, change every filename.


# ----------------------------------------------------------------------------------
# YOU EDIT — these eight
# ----------------------------------------------------------------------------------

# Which corpus and annotation scheme. It comes from your PLAN.md.
# One of:  raamove · cars50 · cars50_step · l2_errors · l2_error_detection
# This picks the pool AND the prompt file. Set it wrong and the notebooks still run
# perfectly — on another track's data, without complaining.
track: cars50

# Your group's name. Goes in every filename above, and on your report.
# Lower-case, no spaces: kimura, tanaka-b, group3
group: yourgroup

# Which attempt this is. Leave it at v1 until something makes you start over —
# you redraw the sample, or you revise the scheme and re-annotate. Then change it
# to v2, and v1's files stay on disk where you can still open them.
# Saving will REFUSE to overwrite a file that already exists, and will point you here.
run: v1

# Any number. Its job is that someone else can redraw your exact sample, so once you
# have annotated anything, do NOT change it — your gold set would stop matching the
# sample it came from. Notebook 05 reports this number.
seed: 42

# How many items per label to sample. This is your FINAL size from the start — there is
# no "keep it small while I fix prompts" phase any more, because the dev set below is
# that phase. 10-15 per label (about 40 items) is the target.
# A rare label returns fewer than you asked for. That is the data, not a bug, and it
# belongs in your limitations.
n_per_class: 10

# How the annotated items get split into a DEV half and a TEST half.
#
# Everything you sample gets double-coded in ONE sheet (notebook 03). The split happens
# after that, so it costs no extra annotation — what it costs is items you are allowed
# to look at. You tune your prompt against dev, as many rounds as you like. Test is not
# opened until the last cell of notebook 04, is scored once, and is the number your
# report leads with.
#
# How the number is written says which of the two ways you meant:
#
#   dev: 3       a WHOLE NUMBER — that many dev items per label. Suits a balanced draw
#                (sample_pool), where every class has the same number to give.
#   dev: 0.35    a DECIMAL between 0 and 1 — that proportion of each label. Suits an
#                uneven draw (sample_random), where a fixed 3-per-class would eat a
#                small class whole.
#
# About 15 dev / 25 test out of 40 is the shape we expect. There is no right ratio at
# this size, only one you can defend: a bigger dev gives steadier feedback while you
# iterate and leaves a smaller test, so the number you finally report bounces more; a
# smaller dev means prompt decisions made on very few items, which is how you tune to
# noise and then watch the gain evaporate. PLAN.md section 6 asks you to write down
# which way you went and why.
dev: 3

# Who labels, and what their columns in the annotation sheet are called. Notebook 03
# creates one tab per name, and notebook 05 uses the same names to find the rows your
# coders disagreed about — so they are set here once rather than typed into two
# notebooks that then have to match.
# Two is the normal case. Three or more works: a row needs adjudicating when they do
# not all agree.
coders:
  - CoderA
  - CoderB

# The Google accounts of everyone in your group. Notebook 03 gives each of them edit
# access to the annotation sheet it creates. Leave this empty and the sheet lives in
# one person's Drive where the second coder cannot open it — which is the whole of
# step 3.
members:
  # - b1234567@dc.tohoku.ac.jp
  # - b7654321@dc.tohoku.ac.jp


# ----------------------------------------------------------------------------------
# ONE MORE, only if your labels are a SCALE
# ----------------------------------------------------------------------------------
# Are your labels ordered, and if so in what order?
#   Move 1..3 is ordered AND alphabetical, so leaving this empty is fine.
#   Low/Mid/High is ordered but NOT alphabetical — write it out, or the weighted
#   kappa gets computed over "High < Low < Mid", which means nothing.
labels_order:
  # - Low
  # - Mid
  # - High
